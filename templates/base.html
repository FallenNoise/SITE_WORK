{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Мой Блог{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link
      rel="shortcut icon"
      href="{% static 'images/favicon.ico' %}"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="{% url 'home' %}" style="color: white; margin-right: 15px"
          >Главная</a
        >
        <a href="{% url 'post_add' %}" style="color: white">Добавить пост</a>
      </nav>
    </header>

    <main>{% block content %} {% endblock %}</main>

    <footer>
      <p>&copy; 2026 FallenNoise project</p>
    </footer>
  </body>
</html>
