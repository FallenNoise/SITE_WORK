{% extends 'base.html' %}

{% block title %}Удалить пост{% endblock %}

{% block content %}
<h1>Удаление публикации</h1>
<p>Вы уверены, что хотите удалить пост "{{ post.title }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; cursor: pointer;">Да, удалить</button>
    <a href="{% url 'post_detail' post.pk %}" style="margin-left: 15px;">Отмена</a>
</form>
{% endblock %}
