{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p><small>Опубликовано: {{ post.created_at }}</small></p>
<hr />
<p>{{ post.content }}</p>
<br />
<a href="{% url 'home' %}">Назад на главную</a>
<a href="{% url 'post_delete' post.pk %}" style="color: red; margin-left: 15px;">Удалить пост</a>
{% endblock %}
